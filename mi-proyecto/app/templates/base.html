<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Cooperativas Sais Capital Social
        {% endblock %}
    </title>

    <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/tailwind.css') }}"
    >

</head>

<body class="min-h-screen flex flex-col">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        class="absolute top-0 left-0 w-full z-50 px-5 md:px-10 py-5"
    >
        <div
            class="w-full flex items-center justify-between gap-6"
        >

            <!-- =================================================
                 LOGO / MARCA
            ================================================== -->

            <a
                class="flex items-center gap-3 text-white shrink-0"
                href="{{ url_for('main.inicio') }}"
            >
                <div
                    class="w-[70px] h-[70px] flex items-center justify-center overflow-visible relative"
                >
                    <img
                        class="w-full h-full object-contain scale-[1.8]"
                        src="{{ url_for('static', filename='img/logo.png') }}"
                        alt="Cooperativas Sais"
                    >
                </div>

                <span
                    class="text-[0.95rem] leading-tight tracking-wide"
                >

                    Cooperativas Sais
                    <br>
                    Capital Social

                </span>

            </a>

            <!-- =================================================
                 NAVEGACIÓN
            ================================================== -->

            <nav
                class="hidden md:flex items-center justify-center gap-3 lg:gap-6 xl:gap-8 flex-1 text-white font-sans text-xs lg:text-sm tracking-wider uppercase"
            >
                <a
                    href="{{ url_for('main.inicio') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Inicio
                </a>

                <a
                    href="{{ url_for('main.conoce_matahuasi') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Conoce
                    <br>
                    Matahuasi
                </a>

                <a
                    href="{{ url_for('main.nosotros') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Nosotros
                </a>

                <a
                    href="{{ url_for('main.datos') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Datos
                </a>

                <a
                    href="{{ url_for('main.contactos') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Contactos
                </a>

                <a
                    href="{{ url_for('main.productos') }}"
                    class="text-center px-2 py-2 hover:opacity-70 transition"
                >
                    Productos
                </a>

            </nav>

            <!-- =================================================
                 ICONOS
            ================================================== -->

            <div
                class="hidden md:flex items-center gap-5 text-white"
            >
                <!-- Buscar -->

                <button
                    type="button"
                    aria-label="Buscar"
                    class="hover:opacity-70 transition"
                >

                    <svg
                        viewBox="0 0 24 24"
                        class="w-7 h-7"
                    >

                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <line
                            x1="16.5"
                            y1="16.5"
                            x2="22"
                            y2="22"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                    </svg>
                </button>

                <!-- Carrito -->

                <button
                    type="button"
                    aria-label="Carrito"
                    class="hover:opacity-70 transition"
                >

                    <svg
                        viewBox="0 0 24 24"
                        class="w-7 h-7"
                    >

                        <path
                            d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <circle
                            cx="10"
                            cy="21"
                            r="1.4"
                            fill="currentColor"
                        />

                        <circle
                            cx="18"
                            cy="21"
                            r="1.4"
                            fill="currentColor"
                        />
                    </svg>
                </button>

                <!-- Cuenta -->

                <button
                    type="button"
                    aria-label="Cuenta"
                    class="hover:opacity-70 transition"
                >

                    <svg
                        viewBox="0 0 24 24"
                        class="w-7 h-7"
                    >
                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                        <path
                            d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
            </div>

            <!-- =================================================
                 MENÚ MÓVIL
            ================================================== -->

            <button
                class="nav-toggle md:hidden flex flex-col gap-1.5"
                aria-label="Abrir menú"
                type="button"
            >

                <span
                    class="w-7 h-0.5 bg-white rounded"
                ></span>

                <span
                    class="w-7 h-0.5 bg-white rounded"
                ></span>

                <span
                    class="w-7 h-0.5 bg-white rounded"
                ></span>
            </button>
        </div>
    </header>

    <!-- =====================================================
         CONTENIDO DE LA PÁGINA
    ====================================================== -->

    <main class="flex-1">
        {% block content %}
        {% endblock %}
    </main>

<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="bg-[#063f35] text-white">

    <div class="max-w-7xl mx-auto px-8 md:px-12 py-6">

        <!-- CONTENIDO PRINCIPAL -->

        <div
            class="flex flex-col md:flex-row md:items-center md:justify-between gap-5"
        >

            <!-- LOGO + NOMBRE -->

            <div class="flex items-center gap-4">
                <div class="w-14 h-14 shrink-0">
                    <img
                        src="{{ url_for('static', filename='img/logo.png') }}"
                        alt="Cooperativas Sais Capital Social"
                        class="w-full h-full object-contain"
                    >
                </div>
                <div>

                    <h2
                        class="font-serif text-sm md:text-base uppercase leading-tight tracking-wide"
                    >
                        Cooperativa Agraria
                        <br>
                        Productores Agropecuarios
                        <br>
                        del Centro del Perú
                    </h2>
                </div>
            </div>


            <!-- ENLACES -->

            <nav class="font-sans text-sm">
                <div class="flex items-center gap-8">

                    <a
                        href="{{ url_for('main.nosotros') }}"
                        class="hover:text-[#a9e6a1] transition"
                    >
                        Nosotros
                    </a>

                    <a
                        href="{{ url_for('main.datos') }}"
                        class="hover:text-[#a9e6a1] transition"
                    >
                        Datos
                    </a>

                    <a
                        href="{{ url_for('main.contactos') }}"
                        class="hover:text-[#a9e6a1] transition"
                    >
                        Contactos
                    </a>
                </div>
            </nav>
        </div>

        <!-- COPYRIGHT -->

        <div
            class="mt-5 pt-4 border-t border-white/20 text-center"
        >

            <p
                class="m-0 font-sans text-xs text-white/70"
            >
                © 2026 Cooperativa Agraria Productores
                Agropecuarios del Centro del Perú
            </p>
        </div>
    </div>
</footer>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
